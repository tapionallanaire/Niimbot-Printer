name: niimbot_print
description: Print text labels and QR codes with supported Niimbot Bluetooth printers on Android and iOS.
version: 0.1.5-bg
homepage: https://zh4dev.github.io/
repository: https://github.com/zh4dev/Niimbot-Printer
issue_tracker: https://github.com/zh4dev/Niimbot-Printer/issues
topics:
  - bluetooth
  - printer
  - label-printer
  - qr-code
  - niimbot

environment:
  sdk: ^3.5.3
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2
  permission_handler: ^13.0.2
  flutter_blue_plus: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.zh4dev.niimbot_print
        pluginClass: NiimbotPrintPlugin
      ios:
        pluginClass: NiimbotPrintPlugin
